
<!--Template Html que irá conter o nome das contas que seguem o usuário-->
<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale 1.0">
        <meta http-equiv="X-UA Compatible" content="Width=device-width, initial-scale 1.0">
        <title>Rede Social</title>

        <!--Link do bootstrap que irá estilizar a página-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    </head>

    <body>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white text-center">
                                <!--Ira acessar e imprimir a mensagem para o usuário que foi definida
                                na view-->
                                <h1 class="h3 mb-0">{{mensagem_seguidores}}</h1>
                        </div>

                        <div class="card-body">

                            <!--Ira mostrar a quantidade de seguidores do usuário autenticado-->
                            <p class="lead text-center mb-4">Você possui <strong class="text-primary">{{numero_seguidores}}</strong> seguidores</p>

                            <!--Antes de mostrar o nome das contas que seguem o usuário, vamos
                            verificar se esse usuário possui algum seguidor.-->
                            {%if seguidores%}

                                <h4 class="mb-3 text-center">Quem te segue:</h4>
                                <ul class="list-group list-group-flush">
                                     <!--Caso o usuário tenha seguidores, iremos percorrer a tabela que contém esses dados com o objetivo de mostra-los na tela.-->
                                    {%for seguidor in seguidores%}

                                        <li class="list-group-item d-flex justify-content-between align items-center">
                                            <!--Impressão dos nomes das contas-->
                                            <p class="mb-0">{{seguidor.nome}}</p>
                                        </li>

                                    <!--Fim da estrutura for-->
                                    {%endfor%}

                                </ul>
                            
                            {%else%}

                                <div class="alert alert-info text-center" role="alert">

                                    <!--Caso o usuário não tenha seguidores, iremos mostrar na tela
                                    essa mensagem padrão.-->
                                    <p>Essa página ainda não possui seguidores</p>

                                </div>
                            
                            <!--Fim da estrutura if-->
                            {%endif%}
                            
                            <div class="card-footer text-center">

                                <!--Link para voltar a página inicial.-->
                                <p><a href="{%url 'index'%}" class="btn btn-secondary">Voltar a página inicial</a></p>

                            </div>
     </body>
</html>
