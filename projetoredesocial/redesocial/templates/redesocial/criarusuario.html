

<!DOCTYPE html>

<html lang="pt-br">

    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale 1.0">

        <meta http-equiv="X-UA Compatible" content="IE=edge">

        <title>Rede Social</title>

        <!--Link para o CSS do bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">


    </head>

    <body class="bg-light">

        <div class="container d-flex justify-content-center align-items-center min-vh-100">
        
            <div class="card p-4 shadow-sm" style="max-width: 450px; width: 100%;">

                <h2 class="text-center mb-4">Crie sua conta</h2>

                <!--Formulário que irá renderizar o form da classe
                forms.py. O form deverá conter o link para view criarusuario(que contém a parte lógica e a instância do form cadastro de usuário definido no forms.py) e O
                método post de envio de dados para o servidor.-->
                <form action="{%url 'criarusuario'%}" method = "post">

                    <!--Token que irá bloquear requisições que não são
                    do nosso sistema.-->
                    {%csrf_token%}

                    <!--Irá formatar os dados em forma de paragráfo-->
                    {{form.as_p}}

                    <!--Botão que irá enviar os dados do usuário que irá se cadastrar-->
                    <button class="btn btn-primary w-100 mt-3" type="submit">Cadastrar</button>

                </form>
               
                <!--Script para o JavaScript do Bootstrap (necessário para alguns componentes)-->
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </body>
</html>
