


<!--Template que irá conter o formulário de inserção de comentários-->
<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale 1.0">
        <meta http-equiv="X-UA Compatible" content="IE=edge">
        <title>Rede Social</title>

        <!--Link para o CSS do bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    </head>


    <body class="bg-light">

        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card p-4 shadow-sm" style="max-width: 500px; width: 100%;">
                <h2 class="text-center mb-4">Comentar Publicação</h2>

                <!--Ira receber o id da postagem e irá inserir no servidor
                o comentário do post-->
                <form method="post">


                    <!--Irá bloquear requisições que não são do nosso sistema.-->
                    {%csrf_token%}

                    <!--Ira formatar os dados inseridos como paragráfo-->
                    {{form.as_p}}

                    <!--Botão que irá inserir o comentário no sistema.-->
                    <button type="submit" class="btn btn-primary w-100 mt-3"> Publicar Comentário</button>
                </form>

                <!--Link para o javascript do bootstrap que lida com iterações animadas no sistema como a mudança de cor de botões por exemplo.-->
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>


    </body>
</html>
