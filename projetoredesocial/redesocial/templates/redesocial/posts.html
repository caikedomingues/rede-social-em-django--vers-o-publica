

<!--Template que irá conter o formulário de criação de postagens
do usuário-->
<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale 1.0">
        <meta http-equiv="X-UA Compatible" content="IE=edge">
        <title>Rede Social</title>

        <!--Link para o bootstrap que irá estilizar a nossa página-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    </head>

    <body>

        <div class="container mt-4">

            <h1 class="mb-4">Criar Nova Publicação</h1>
            
            <!--Formulário que irá possibilitar que o usuário crie postagens em sua rede. O form devera conter o link para
            a view de posts(que contem a instância do formulário de posts criado no forms.py), o método post que envia dados para o servidor e o enctype que possibilita o envio de arquivos
            (fotos ou videos no nosso caso)-->
            <form action="{%url 'posts'%}" method="post" enctype="multipart/form-data">

                <!--Token que irá bloquear requisições que não são do nosso sistema.-->
                {%csrf_token%}

                <!--Ira formatar os dados como paragráfo-->
                {{form.as_p}}

                <!--Botão que irá enviar dados para o servidor-->
                <button class="btn btn-primary" type="submit">Publicar Post</button>
            </form>
    </body>
</html>
