

<!--Template que irá conter todas as contas que o usuário
segue-->
<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale 1.0">
        <meta http-equiv="X-UA Compatible" content="IE=edge">
        <title>Rede Social</title>

        <!--Link do bootstrap que irá estilizar a página-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    </head>

    <body>

        <div class="container mt-4">
            <!--Ira mostrar na tela a mensagem para o usuário definida 
            na view-->
            <h1 class="mb-3">{{mensagem_quem_sigo}}</h1>

            <!--Irá mostrar a quantidade de contas que o usuário segue-->
            <p class="lead mb-4">você segue <strong class="text-primary">{{numero_seguindo}}</strong> páginas</p>

            <!--Antes de acessar os dados, vamos verificar se o usuário segue alguma conta-->
            {%if seguindo%}

                <div class="list-group">

                    <!--Se o usuário estiver seguindo alguma conta, vamos 
                    percorrer a coluna de seguindo com o objetivo de acessar
                    as contas que o usuário segue-->
                    {%for me_segue in seguindo%}

                        <!--Impressão dos nomes das contas seguidas pelo usuário-->
                        <p class="list-group-item list-group-item-action">{{me_segue.nome}}</p>

                    <!--Fim da estrutura for-->
                    {%endfor%}

                </div>

            {%else%}

                <!--Se o usuário não estiver seguindo nenhuma conta
                vamos apresentar essa mensagem padrão-->
                <p class="alert alert-info">Você ainda não segue ninguem</p>

            <!--Fim da estrutura if-->
            {%endif%}
            
            <!--Link para voltar a página inicial-->
            <p class="mt-4 text-center"><a class="btn btn-secondary" href="{%url 'index'%}">Voltar a página inicial</a></p>
    </body>
</html>
