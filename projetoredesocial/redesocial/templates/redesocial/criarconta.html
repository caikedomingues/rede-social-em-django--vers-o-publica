

<!--Template Html da página de criação de contas/páginas da
rede social.-->
<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale 1.0">

        <meta http-equiv="X-UA Compatible" content="IE=edge">

        <!--Link do bootstrap que irá estilizar o sistema-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">


        <title>Rede Social</title>

    </head>


    <body>

        <div class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card">

                        <div class="card-header">

                            <h3 class="text-center">Criar Conta</h3>
                        </div>

                        <div class="card-body">

                            <!--Formulário de criação de contas/páginas da rede social.O formulário deve conter o link da view de criarconta, o método de envio de dados para o servidor (post) e o
                            enctype que permite o envio de arquivos para
                            o servidor (No nosso caso o envio de fotos de perfil.) -->
                            <form action = "{%url 'criarconta'%}" method="post" enctype="multipart/form-data">

                                <!--token que bloqueia requisições 
                                que não do nosso sistema.-->
                                {%csrf_token%}

                                <!--Irá formatar os dados como paragráfo.-->
                                {{form.as_p}}
                                
                                <div class="d-grid gap-2">

                                    <!--Botão que irá enviar os dados para o servidor.-->
                                    <button type="submit" class="btn btn-primary">Criar Conta</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>  
                    
    </body>
</html>
